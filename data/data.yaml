# Garden Guardian — dataset config
# Edit `names` to match the crops actually planted in YOUR garden.
# Use real crop names (basil, tomato...), never crop1/crop2 — renaming later is painful.

path: .          # dataset root (relative to this file)
train: train/images
val: valid/images
test: test/images

names:
  # Confirmed 2026-08-06: 3 plants of each, all planted directly in soil.
  0: tomato
  1: basil
  2: marigold
  # Target weeds, both confirmed against the real garden 2026-08-06.
  3: dandelion
  4: hawkweed
